name: Build DankTech2 Legacy

on:
  push:
    branches:
      - master
      - 'agent/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  LEGACY_ARTIFACT: SF_DankTech2_1.1.01.jar

jobs:
  build:
    name: Paper 26.2 / Java 25
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify 26.2 build metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<paper.version>26.2.build.111-stable</paper.version>' pom.xml
          grep -Fq '<maven.compiler.release>25</maven.compiler.release>' pom.xml
          grep -Fq '<finalName>SF_DankTech2_1.1.01</finalName>' pom.xml
          grep -Fq "api-version: '1.21'" src/main/resources/plugin.yml

      - name: Verify no obsolete Java target remains
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '<maven.compiler.(source|target)>1\.8</maven.compiler.|java-version: *(16|17|21)' pom.xml .github/workflows/maven.yml; then
            echo 'An obsolete Java build target is still configured.'
            exit 1
          fi

      - name: Build and verify
        run: mvn -B clean verify --file pom.xml

      - name: Verify exact plugin JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="target/${LEGACY_ARTIFACT}"
          test -s "$JAR"
          jar tf "$JAR" | grep -Fxq 'plugin.yml'
          unzip -p "$JAR" plugin.yml | grep -Fq 'version: 1.1.01'
          unzip -p "$JAR" plugin.yml | grep -Fq "api-version: '1.21'"
          sha256sum "$JAR"

      - name: Upload direct JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.LEGACY_ARTIFACT }}
          path: target/${{ env.LEGACY_ARTIFACT }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct JAR release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          JAR="target/${LEGACY_ARTIFACT}"
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --generate-notes --title "DankTech2 Legacy $TAG"
          fi
